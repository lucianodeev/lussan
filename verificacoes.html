<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LUSSAN — Verificações</title><style>body{font:16px system-ui;background:#101827;color:#f6f2ea;max-width:720px;margin:6vh auto;padding:20px}input,button{font:inherit;padding:12px;border-radius:8px;margin:5px 0}button{background:#d8a85e;border:0;cursor:pointer}input{display:block;width:95%}article{border:1px solid #8b7559;padding:14px;border-radius:12px;margin:12px 0}small{color:#b6bdc8}</style></head><body><h1>LUSSAN — Painel privado</h1><p>Área exclusiva para administradores autorizados. Documentos de clientes não são enviados por e-mail.</p><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button><button id="forgot" type="button">Esqueci minha senha</button></form><form id="reset" hidden><h2>Criar nova senha</h2><label>Nova senha<input id="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><label>Repetir nova senha<input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Guardar nova senha</button></form><button id="logout" hidden>Sair</button><p id="notice" role="status"></p><section id="queue" hidden><h2>Pedidos de verificação</h2><div id="orders"></div><small>Visualização apenas. Aprovação e envio de documentos serão habilitados depois de testes de segurança.</small></section><script>
const api='https://lussan-booking-api.onrender.com',base='https://lcvuuqtdboucayrysdvc.supabase.co',key='sb_publishable_971K_Gj5xcyfxuLof3wGZA_ChEcm0iq';let token='';
const notice=document.getElementById('notice'),form=document.getElementById('login'),queue=document.getElementById('queue');
const resetForm=document.getElementById('reset');
document.getElementById('forgot').onclick=async()=>{
 const email=document.getElementById('email').value.trim();if(!email.includes('@')||!email.split('@')[1]?.includes('.')){notice.textContent='Introduza um e-mail válido.';return}
 notice.textContent='A solicitar recuperação…';
 try{const response=await fetch(base+'/auth/v1/recover?redirect_to='+encodeURIComponent('https://lussan.onrender.com/verificacoes.html'),{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email})});if(!response.ok)throw Error('Falha no envio. Verifique a configuração de e-mail do Supabase.');notice.textContent='Se o e-mail estiver registado, receberá um link para criar uma nova senha. Verifique também o spam.'}catch(e){notice.textContent=e.message}
};
const fragment=new URLSearchParams(location.hash.slice(1));
if(fragment.get('type')==='recovery'&&fragment.get('access_token')){
 token=fragment.get('access_token');resetForm.hidden=false;form.hidden=true;notice.textContent='Crie uma senha forte com pelo menos 12 caracteres.';history.replaceState(null,'',location.pathname);
}
resetForm.onsubmit=async e=>{
 e.preventDefault();const password=document.getElementById('newPassword').value;
 if(password.length<12||password!==document.getElementById('confirmPassword').value){notice.textContent='As senhas devem coincidir e ter pelo menos 12 caracteres.';return}
 try{const response=await fetch(base+'/auth/v1/user',{method:'PUT',headers:{apikey:key,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password})});if(!response.ok)throw Error('Link inválido ou expirado. Solicite outro e-mail.');token='';resetForm.hidden=true;form.hidden=false;document.getElementById('password').value='';document.getElementById('newPassword').value='';document.getElementById('confirmPassword').value='';notice.textContent='Senha atualizada. Entre com a nova senha.'}catch(err){notice.textContent=err.message}
};
document.getElementById('logout').onclick=()=>{token='';form.hidden=false;queue.hidden=true;document.getElementById('logout').hidden=true;document.getElementById('password').value='';notice.textContent='Sessão encerrada.'};
form.onsubmit=async e=>{e.preventDefault();notice.textContent='A autenticar…';try{
const r=await fetch(base+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:key,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!r.ok)throw Error('E-mail ou senha inválidos.');const data=await r.json();const a=await fetch(api+'/api/verification-admin/me',{headers:{Authorization:'Bearer '+data.access_token}});if(!a.ok)throw Error('Conta sem autorização administrativa.');token=data.access_token;form.hidden=true;document.getElementById('logout').hidden=false;notice.textContent='Acesso autorizado.';await load();}catch(err){notice.textContent=err.message}};
async function load(){const r=await fetch(api+'/api/verification-admin/queue',{headers:{Authorization:'Bearer '+token}});if(!r.ok){notice.textContent='Não foi possível carregar a fila.';return}const data=await r.json();const target=document.getElementById('orders');target.replaceChildren();for(const order of data.requests||[]){const card=document.createElement('article');const h=document.createElement('strong');h.textContent=order.product==='photos'?'Fotografias':'Revista';const p=document.createElement('p');p.textContent='Estado: '+order.verification_status+' · Pedido: '+order.cart_order_id;card.append(h,p);target.append(card)}if(!data.requests?.length)target.textContent='Nenhuma verificação registada.';queue.hidden=false}
</script></body></html>
