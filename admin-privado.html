<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>LUSSAN — Acesso privado</title>
<style>body{background:#101827;color:#f6f2ea;font:16px system-ui;max-width:680px;margin:7vh auto;padding:22px}input,button{font:inherit;padding:13px;border-radius:9px;margin:7px 0}input{display:block;box-sizing:border-box;width:100%;border:1px solid #806f58}button{background:#d8a85e;border:0;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:transparent;color:#e6c38b;text-decoration:underline}article{border:1px solid #806f58;padding:14px;margin:12px 0;border-radius:10px}label{display:block;margin:12px 0}small{color:#d0c6b7}#status{line-height:1.5}[hidden]{display:none!important}</style></head>
<body><h1>LUSSAN</h1><p>Acesso administrativo privado</p>
<form id="login"><label>E-mail<input type="email" id="email" autocomplete="username" required></label><label>Senha<input type="password" id="password" autocomplete="current-password" maxlength="256" required></label><button>Entrar</button><button type="button" class="secondary" id="show-recovery">Definir ou recuperar senha</button></form>
<form id="recovery" hidden><h2>Receber um link seguro</h2><label>E-mail<input type="email" id="recovery-email" autocomplete="username" required></label><p>O link é enviado apenas para o e-mail autorizado e permite definir uma nova senha.</p><button>Enviar link por e-mail</button><button type="button" class="secondary" id="back">Voltar</button></form>
<form id="reset" hidden><h2>Definir nova senha</h2><p>Escolha uma senha exclusiva com pelo menos 12 caracteres.</p><label>Nova senha<input type="password" id="new-password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>Confirmar nova senha<input type="password" id="confirm-password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button>Guardar nova senha</button></form>
<button id="logout" hidden>Sair</button><p id="status" role="status" aria-live="polite"></p><section id="queue" hidden><h2>Verificações</h2><div id="items"></div><button id="refresh">Atualizar pedidos</button></section>
<script>
'use strict';
const base='https://lussan-booking-api.onrender.com/api/private-admin/',get=id=>document.getElementById(id),status=get('status');
let token='',resetToken=new URLSearchParams(location.hash.slice(1)).get('reset')||'',timer;
if(location.hash)history.replaceState(null,'',location.pathname+location.search);
const messages={invalid_credentials:'E-mail ou senha incorretos.',try_later:'Muitas tentativas. Aguarde antes de tentar novamente.',setup_required:'Defina a sua senha pelo link seguro enviado por e-mail.',invalid_or_expired_link:'Este link expirou ou já foi utilizado. Solicite um novo link.',password_length:'Utilize entre 12 e 256 caracteres.',email_setup_required:'O envio de recuperação ainda não está configurado no serviço Lussan. É necessário configurar o remetente e a chave de envio.',email_unavailable:'Não foi possível enviar o e-mail. Tente novamente mais tarde.'};
async function api(path,body){const r=await fetch(base+path,{method:body?'POST':'GET',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok){const e=Error(messages[data.error]||'Serviço temporariamente indisponível. Tente novamente.');e.code=r.status;throw e}return data}
function view(id){for(const name of ['login','recovery','reset','queue'])get(name).hidden=name!==id;get('logout').hidden=id!=='queue'}
function logout(message='Sessão encerrada.'){clearTimeout(timer);token='';get('items').replaceChildren();get('password').value='';view('login');status.textContent=message}
async function submit(form,work){const buttons=form.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{await work()}catch(e){status.textContent=e.message}finally{buttons.forEach(b=>b.disabled=false)}}
async function loadQueue(){try{const list=await api('queue');get('items').replaceChildren();for(const x of list.requests||[]){const card=document.createElement('article');card.textContent=(x.product==='photos'?'Fotografias':'Revista')+' — '+x.verification_status+' — Pedido '+x.cart_order_id;const contact=document.createElement('p');contact.textContent=[x.buyer_name,x.contact,x.product==='photos'?x.photo_contact:x.magazine_email].filter(Boolean).join(' · ');card.append(contact);if(x.has_files){for(const [kind,label] of [['document','Ver documento'],['selfie','Ver selfie']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>submit(card,async()=>{const r=await fetch(base+'files/'+encodeURIComponent(x.cart_order_id)+'/'+kind,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('Não foi possível abrir o ficheiro.');const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=kind;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)});card.append(b)}}if(x.has_files&&x.verification_status==='pending_review'){for(const [decision,label] of [['approved','Aprovar maioridade'],['rejected','Rejeitar e pedir novo envio']]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(!confirm('Confirmar esta decisão? As cópias do documento e da selfie serão apagadas. A entrega do produto continua a ser manual.'))return;submit(card,async()=>{await api('review',{orderId:x.cart_order_id,decision});await loadQueue()})};card.append(b)}}get('items').append(card)}if(!list.requests?.length)get('items').textContent='Nenhuma verificação registada.';view('queue');status.textContent='Acesso autorizado.'}catch(e){if(e.code===401)logout('A sessão expirou. Entre novamente.');throw e}}
get('logout').onclick=()=>logout();get('show-recovery').onclick=()=>{get('recovery-email').value=get('email').value;view('recovery');status.textContent=''};get('back').onclick=()=>{view('login');status.textContent=''};
get('login').onsubmit=e=>{e.preventDefault();submit(get('login'),async()=>{status.textContent='A verificar acesso…';const data=await api('login',{email:get('email').value,password:get('password').value});token=data.token;get('password').value='';clearTimeout(timer);timer=setTimeout(()=>logout('A sessão expirou. Entre novamente.'),data.expires_in*1000);await loadQueue()})};
get('recovery').onsubmit=e=>{e.preventDefault();submit(get('recovery'),async()=>{status.textContent='A enviar…';await api('request-password-reset',{email:get('recovery-email').value});status.textContent='Se o e-mail estiver autorizado, receberá um link válido por 30 minutos.'})};
get('reset').onsubmit=e=>{e.preventDefault();submit(get('reset'),async()=>{if(get('new-password').value!==get('confirm-password').value)throw Error('As senhas não coincidem.');status.textContent='A guardar a nova senha…';await api('reset-password',{token:resetToken,password:get('new-password').value});resetToken='';get('reset').reset();logout('Senha definida. Entre com o seu e-mail e a nova senha.')})};
get('refresh').onclick=()=>submit(get('queue'),loadQueue);
if(resetToken){view('reset');status.textContent='Este link é privado e só pode ser utilizado uma vez.'}else{api('status').then(data=>{if(!data.reset_email_ready){status.textContent=data.ready?'Login disponível. Recuperação por e-mail ainda não configurada.':'Acesso ainda não configurado: falta definir a senha e configurar o envio do link de recuperação.'}else if(!data.ready){status.textContent='Defina a sua senha em “Definir ou recuperar senha”.'}}).catch(e=>status.textContent=e.message)}
</script></body></html>
