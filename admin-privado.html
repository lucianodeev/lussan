<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LUSSAN — Acesso privado</title><style>body{background:#101827;color:#f6f2ea;font:16px system-ui;max-width:680px;margin:7vh auto;padding:22px}input,button{font:inherit;padding:13px;border-radius:9px;margin:7px 0}input{display:block;width:95%}button{background:#d8a85e;border:0;cursor:pointer}article{border:1px solid #806f58;padding:14px;margin:12px 0;border-radius:10px}</style></head><body><h1>LUSSAN</h1><p>Acesso administrativo independente</p><form id="login"><label>E-mail<input type="email" id="email" autocomplete="username" required></label><label>Senha<input type="password" id="password" autocomplete="current-password" required></label><button>Entrar</button></form><button id="logout" hidden>Sair</button><p id="status" role="status"></p><section id="queue" hidden><h2>Verificações</h2><div id="items"></div></section><script>
const base='https://lussan-booking-api.onrender.com',form=document.getElementById('login'),status=document.getElementById('status'),queue=document.getElementById('queue');let token='';
fetch(base+'/api/private-admin/status').then(r=>r.json()).then(x=>{if(!x.ready){form.hidden=true;status.textContent='Acesso em preparação. O administrador precisa configurar as credenciais seguras no servidor.'}}).catch(()=>{status.textContent='Serviço temporariamente indisponível.'});
document.getElementById('logout').onclick=()=>{token='';queue.hidden=true;form.hidden=false;document.getElementById('logout').hidden=true;document.getElementById('password').value='';status.textContent='Sessão encerrada.'};
form.onsubmit=async e=>{e.preventDefault();status.textContent='A verificar acesso…';try{const r=await fetch(base+'/api/private-admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});if(!r.ok)throw Error(r.status===429?'Muitas tentativas. Aguarde 15 minutos.':r.status===503?'Acesso ainda não configurado.':'Credenciais inválidas.');const data=await r.json();token=data.token;document.getElementById('password').value='';const q=await fetch(base+'/api/private-admin/queue',{headers:{Authorization:'Bearer '+token}});if(!q.ok)throw Error('Não foi possível carregar os pedidos.');const list=await q.json();const items=document.getElementById('items');items.replaceChildren();for(const x of list.requests||[]){const card=document.createElement('article');card.textContent=(x.product==='photos'?'Fotografias':'Revista')+' — '+x.verification_status+' — Pedido '+x.cart_order_id;items.append(card)}if(!list.requests?.length)items.textContent='Nenhuma verificação registada.';form.hidden=true;queue.hidden=false;document.getElementById('logout').hidden=false;status.textContent='Acesso autorizado.'}catch(err){status.textContent=err.message}};
</script></body></html>
